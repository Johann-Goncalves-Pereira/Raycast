<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qui</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-container">
    <!-- Native top drag strip: seamless window dragging with no visual top bar -->
    <div id="drag-strip" data-tauri-drag-region></div>

    <!-- Floating traffic lights: discreet and transparent, fades in on hover -->
    <nav class="floating-controls" aria-label="Window Controls">
      <button id="btn-close" class="control-btn close" title="Close & Stop Qui (Cmd+W)" aria-label="Close"></button>
      <button id="btn-minimize" class="control-btn minimize" title="Minimize (Cmd+M)" aria-label="Minimize"></button>
      <button id="btn-maximize" class="control-btn maximize" title="Maximize" aria-label="Maximize"></button>
    </nav>

    <!-- Translucent Loading View during startup -->
    <div id="loader-view" class="loader-view">
      <div class="loader-card">
        <div class="logo-wrapper">
          <img src="icons/icon.png" class="pulsing-logo" alt="Qui" />
        </div>
        <h2 class="loader-title">Qui Dashboard</h2>
        <p id="loader-status" class="loader-status">Initializing WebKit environment...</p>
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="steps-list">
          <div id="step-docker" class="step pending">1. Docker daemon check</div>
          <div id="step-update" class="step pending">2. Pull latest Qui image</div>
          <div id="step-container" class="step pending">3. Start Qui container</div>
          <div id="step-ready" class="step pending">4. Connect to WebKit Web UI</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
